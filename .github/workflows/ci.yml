name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy && rustup default 1.93.1

      - name: Verify Rust processor
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo test --locked --manifest-path native/Cargo.toml
          cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
          python scripts/build_native.py

      - name: Test
        run: pytest tests/unit tests/services tests/integration

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: factchecker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/factchecker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: rustup toolchain install 1.93.1 --profile minimal && rustup default 1.93.1
      - run: python scripts/build_native.py
      - run: pytest tests/integration
